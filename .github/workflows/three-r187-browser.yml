name: Three.js r187 browser QA
on:
  pull_request:
    paths:
      - "src/Scene.tsx"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/three-r187-browser.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lumnie-r187-browser
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
