name: Motion and interaction browser QA
on:
  pull_request:
    paths:
      - "src/MotionSurface.tsx"
      - "src/LumniApp.tsx"
      - "tests/motion-foundations.spec.ts"
      - ".github/workflows/motion-browser.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify formatting
        run: |
          if ! pnpm format:check; then
            pnpm format
            git diff -- src/LumniApp.tsx src/MotionSurface.tsx tests/motion-foundations.spec.ts
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
