name: Temporary 3D scene formatting
on:
  push:
    branches:
      - perf/scene-visibility-frame-loop-nov26
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt src/Scene.tsx src/scene-quality.ts tests/scene-quality.spec.ts
      - name: Commit formatting for isolated performance PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add src/Scene.tsx src/scene-quality.ts tests/scene-quality.spec.ts
            git commit -m 'style: format renderer visibility controls'
            git push origin HEAD:perf/scene-visibility-frame-loop-nov26
          fi
